<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form - IT Seminar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>IT Seminar Registration</h2>
        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required aria-invalid="false" aria-describedby="fullNameError">
                <span id="fullNameError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="studentNumber">Student Number</label>
                <input type="text" id="studentNumber" required aria-invalid="false" aria-describedby="studentNumberError">
                <span id="studentNumberError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required aria-invalid="false" aria-describedby="emailError">
                <span id="emailError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" required aria-invalid="false" aria-describedby="mobileNumberError">
                <span id="mobileNumberError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required aria-invalid="false" aria-describedby="passwordError passwordFeedback">
                <span id="passwordFeedback" class="feedback-message"></span>
                <span id="passwordError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required aria-invalid="false" aria-describedby="confirmPasswordError">
                <span id="confirmPasswordError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" required aria-invalid="false" aria-describedby="courseError">
                    <option value="" disabled selected>Select your course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>
                <span id="courseError" class="error-message"></span>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" required aria-invalid="false" aria-describedby="termsError">
                <label for="terms">I agree to the terms and conditions</label>
                <span id="termsError" class="error-message"></span>
            </div>

            <div class="button-group">
                <button type="submit" id="registerBtn">Register</button>
                <button type="reset" id="resetBtn">Reset</button>
            </div>
        </form>

        <div id="successMessage" class="success-message"></div>
        <div id="registrationSummary" class="summary-container">
            <h3>Registration Summary</h3>
            <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
            <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
            <p><strong>Email Address:</strong> <span id="summaryEmail"></span></p>
            <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
            <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
